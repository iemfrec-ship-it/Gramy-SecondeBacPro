<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRAMY ⚔️ Grammaire Anglaise – Bac Pro 2nde</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --grass:#5D8A3C;--grass-dk:#3D6A1C;--dirt:#8B5E3C;--stone:#7A7A7A;
  --stone-dk:#3A3A3A;--stone-lt:#A0A0A0;--diamond:#4BDFE8;--gold:#FFD700;
  --red:#C0392B;--green:#27AE60;--bg:#0D1117;--bg2:#161B22;--bg3:#1C2128;
  --text:#E8E8E8;--text-dim:#888;--iron:#C0C0C0;
}
body{font-family:'Press Start 2P',monospace;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,0.015) 0,rgba(255,255,255,0.015) 1px,transparent 1px,transparent 32px),repeating-linear-gradient(0deg,rgba(255,255,255,0.015) 0,rgba(255,255,255,0.015) 1px,transparent 1px,transparent 32px);pointer-events:none;z-index:0}
#app{flex:1;padding:1.2rem;max-width:920px;margin:0 auto;width:100%;position:relative;z-index:1}

/* MINECRAFT BOXES */
.mc-box{background:var(--bg2);border:4px solid;border-color:var(--stone-lt) var(--stone-dk) var(--stone-dk) var(--stone-lt);position:relative}
.mc-box::after{content:'';position:absolute;inset:2px;border:1px solid rgba(0,0,0,.4);pointer-events:none}

/* BUTTONS */
.mc-btn{display:inline-block;font-family:'Press Start 2P',monospace;font-size:.55rem;padding:.7rem 1.2rem;cursor:pointer;background:var(--stone);color:var(--text);border:4px solid;border-color:var(--stone-lt) var(--stone-dk) var(--stone-dk) var(--stone-lt);transition:transform .1s,filter .1s;user-select:none;text-decoration:none;letter-spacing:0}
.mc-btn:hover{filter:brightness(1.2)}
.mc-btn:active{transform:translate(2px,2px);border-color:var(--stone-dk) var(--stone-lt) var(--stone-lt) var(--stone-dk)}
.mc-btn.green{background:var(--grass-dk);border-color:var(--grass) #1A4A0A #1A4A0A var(--grass)}
.mc-btn.red{background:#7A0A0A;border-color:var(--red) #500 #500 var(--red)}
.mc-btn.gold{background:#8A6B00;border-color:var(--gold) #5A4000 #5A4000 var(--gold);color:#000}
.mc-btn.diamond{background:#006080;border-color:var(--diamond) #004050 #004050 var(--diamond)}
.mc-btn.grey{background:#444;border-color:#666 #222 #222 #666}

/* HOME */
.home-wrap{text-align:center;padding:1.5rem 0}
.home-title{font-size:1.6rem;color:var(--gold);text-shadow:3px 3px 0 #7A6000,6px 6px 0 rgba(0,0,0,.6);line-height:1.5;margin-bottom:.5rem}
.home-sub{font-size:.42rem;color:var(--text-dim);margin-bottom:2rem;line-height:2}
.home-cards{display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;margin:2rem 0}
.home-card{background:var(--bg2);border:4px solid;border-color:var(--stone-lt) var(--stone-dk) var(--stone-dk) var(--stone-lt);padding:2rem 1.5rem;cursor:pointer;min-width:200px;transition:transform .2s,filter .2s;flex:1;max-width:280px}
.home-card:hover{transform:translateY(-6px);filter:brightness(1.15)}
.home-card .hc-icon{font-size:3rem;margin-bottom:1rem}
.home-card h2{font-size:.65rem;color:var(--gold);margin-bottom:.7rem}
.home-card p{font-size:.4rem;color:var(--text-dim);line-height:2}

/* LOGIN */
.login-wrap{max-width:420px;margin:2rem auto}
.login-wrap h2{font-size:.7rem;color:var(--gold);text-align:center;margin-bottom:1.5rem}
.form-group{margin-bottom:1.2rem}
.form-group label{display:block;font-size:.45rem;color:var(--text-dim);margin-bottom:.5rem}
.form-group input,.form-group select{width:100%;background:#050A14;border:3px solid var(--stone-dk);border-right-color:var(--stone-lt);border-bottom-color:var(--stone-lt);color:var(--text);font-family:'Press Start 2P',monospace;font-size:.6rem;padding:.7rem;outline:none}
.form-group input:focus{border-color:var(--diamond)}
.form-group .hint{font-size:.38rem;color:var(--text-dim);margin-top:.4rem;line-height:2}
.form-row{display:flex;gap:1rem}
.form-row .form-group{flex:1}
.msg-err{color:var(--red);font-size:.45rem;margin-top:.5rem;text-align:center}
.msg-ok{color:var(--green);font-size:.45rem;margin-top:.5rem;text-align:center}

/* NAV */
.nav-back{font-size:.45rem;color:var(--diamond);cursor:pointer;margin-bottom:1.2rem;display:inline-flex;align-items:center;gap:.5rem}
.nav-back:hover{color:var(--gold)}
.page-header{margin-bottom:1.3rem}
.page-header h1{font-size:.85rem;color:var(--gold);text-shadow:2px 2px 0 #7A6000;margin-bottom:.5rem}
.page-header p{font-size:.4rem;color:var(--text-dim);line-height:2}

/* STUDENT INFO BAR */
.student-bar{display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border:2px solid var(--stone-dk);padding:.5rem 1rem;margin-bottom:1.2rem;font-size:.4rem;flex-wrap:wrap;gap:.5rem}
.student-bar .sname{color:var(--diamond)}
.student-bar .sclass{color:var(--gold)}

/* THEMES */
.themes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;margin:1rem 0}
.theme-card{background:var(--bg2);border:4px solid;border-color:var(--stone-lt) var(--stone-dk) var(--stone-dk) var(--stone-lt);padding:1.2rem;cursor:pointer;transition:transform .2s,filter .2s;position:relative;overflow:hidden}
.theme-card:hover{transform:translateY(-4px);filter:brightness(1.15)}
.theme-card .tc-icon{font-size:2rem;margin-bottom:.7rem}
.theme-card h3{font-size:.52rem;color:var(--gold);margin-bottom:.3rem}
.theme-card .tc-sub{font-size:.4rem;color:var(--text-dim);margin-bottom:.3rem}
.theme-card .tc-lex{font-size:.38rem;color:var(--diamond);margin-bottom:.8rem}
.level-dots{display:flex;gap:5px;margin-top:.6rem}
.ld{width:14px;height:14px;border:2px solid var(--stone-dk)}
.ld.done{background:var(--gold)}
.ld.unlocked{background:var(--grass)}
.ld.locked{background:#222}
.tc-progress{margin-top:.6rem;height:8px;background:#111;border:2px solid var(--stone-dk);overflow:hidden}
.tc-progress-fill{height:100%;background:linear-gradient(90deg,var(--grass-dk),var(--gold));transition:width .4s}

/* LEVELS */
.levels-list{display:flex;flex-direction:column;gap:.8rem;margin:1rem 0}
.level-card{display:flex;align-items:center;gap:1rem;background:var(--bg2);border:4px solid;border-color:var(--stone-lt) var(--stone-dk) var(--stone-dk) var(--stone-lt);padding:1rem 1.3rem;cursor:pointer;transition:transform .15s,filter .15s}
.level-card:hover:not(.locked){transform:translateY(-3px);filter:brightness(1.15)}
.level-card.locked{opacity:.45;cursor:not-allowed}
.level-card.done{border-color:var(--gold) #5A4000 #5A4000 var(--gold)}
.lv-badge{width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0;border:3px solid var(--stone-dk)}
.lv-badge.stone{background:var(--stone)}
.lv-badge.iron{background:#6A6A6A}
.lv-badge.gold{background:var(--gold)}
.lv-badge.diamond{background:var(--diamond)}
.lv-info{flex:1}
.lv-info h3{font-size:.55rem;color:var(--gold);margin-bottom:.35rem}
.lv-info .lv-type{font-size:.4rem;color:var(--text-dim);margin-bottom:.4rem}
.lv-info .lv-score{font-size:.45rem;color:var(--green)}
.lv-lock{font-size:1.4rem}

/* EXERCISE SELECT (when multiple exercises in a level) */
.ex-select-list{display:flex;flex-direction:column;gap:.8rem;margin:1rem 0}
.ex-select-card{background:var(--bg2);border:4px solid;border-color:var(--stone-lt) var(--stone-dk) var(--stone-dk) var(--stone-lt);padding:1rem 1.3rem;cursor:pointer;transition:filter .15s}
.ex-select-card:hover{filter:brightness(1.2)}
.ex-select-card h3{font-size:.55rem;color:var(--diamond);margin-bottom:.4rem}
.ex-select-card .ex-done-tag{font-size:.4rem;color:var(--gold)}

/* XP BAR */
.xp-wrap{margin-bottom:1.2rem}
.xp-label{display:flex;justify-content:space-between;font-size:.38rem;color:var(--text-dim);margin-bottom:.3rem}
.xp-bar{height:14px;background:#111;border:3px solid var(--stone-dk);overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--grass-dk),var(--gold));transition:width .4s}

/* EXERCISE */
.ex-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.ex-title{font-size:.5rem;color:var(--gold)}
.ex-counter{font-size:.45rem;color:var(--text-dim)}
.question-box{background:var(--bg2);border:4px solid;border-color:var(--stone-lt) var(--stone-dk) var(--stone-dk) var(--stone-lt);padding:1.3rem;margin-bottom:1.2rem}
.q-text{font-size:.65rem;line-height:2;margin-bottom:1.2rem;color:#FFF}
.q-blank{border-bottom:3px solid var(--diamond);min-width:80px;display:inline-block;text-align:center;background:#0A0A20}

/* QCM */
.qcm-opts{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.qcm-opt{display:flex;align-items:center;gap:.7rem;background:#0A0A20;border:3px solid var(--stone-dk);padding:.7rem;cursor:pointer;font-size:.55rem;font-family:'Press Start 2P',monospace;color:var(--text);transition:border-color .15s,background .15s;text-align:left}
.qcm-opt:hover:not(.locked){border-color:var(--diamond);background:#101030}
.qcm-opt.sel{border-color:var(--gold);background:#1A1800}
.qcm-opt.ok{border-color:var(--green)!important;background:#041A08!important;color:var(--green)!important}
.qcm-opt.ko{border-color:var(--red)!important;background:#1A0404!important;color:#FF7070!important}
.qcm-opt.locked{cursor:default}
.opt-letter{width:22px;height:22px;background:var(--stone);display:flex;align-items:center;justify-content:center;font-size:.45rem;flex-shrink:0}

/* BLANK */
.blank-hint{font-size:.45rem;color:var(--diamond);margin-bottom:.4rem}
.blank-input{width:100%;background:#050A14;border:3px solid var(--stone-dk);border-right-color:var(--stone-lt);border-bottom-color:var(--stone-lt);color:var(--text);font-family:'Press Start 2P',monospace;font-size:.7rem;padding:.8rem;outline:none;margin-top:.5rem}
.blank-input:focus{border-color:var(--diamond)}
.blank-input.ok{border-color:var(--green);background:#041A08;color:var(--green)}
.blank-input.ko{border-color:var(--red);background:#1A0404;color:#FF7070}

/* WORD ORDER */
.order-instruction{font-size:.42rem;color:var(--text-dim);margin-bottom:.6rem}
.word-bank-label,.word-ans-label{font-size:.38rem;color:var(--text-dim);margin-bottom:.3rem}
.word-bank{display:flex;flex-wrap:wrap;gap:.5rem;min-height:46px;padding:.7rem;background:#050A14;border:3px solid var(--stone-dk);margin-bottom:.7rem}
.word-ans{display:flex;flex-wrap:wrap;gap:.5rem;min-height:46px;padding:.7rem;background:#041408;border:3px solid var(--grass-dk);margin-bottom:.7rem}
.wchip{background:var(--stone);border:2px solid;border-color:var(--stone-lt) var(--stone-dk) var(--stone-dk) var(--stone-lt);padding:.4rem .7rem;font-family:'Press Start 2P',monospace;font-size:.48rem;cursor:pointer;user-select:none;transition:transform .1s,filter .1s}
.wchip:hover{filter:brightness(1.3);transform:translateY(-2px)}
.wchip.in-ans{background:var(--grass-dk);border-color:var(--grass) #1A4A0A #1A4A0A var(--grass)}

/* ERROR */
.err-sentence{font-size:.7rem;line-height:2;padding:1rem;background:#050A14;border:3px solid var(--stone-dk);margin-bottom:1rem;text-align:center}
.err-btns{display:flex;gap:1rem;justify-content:center}

/* FEEDBACK */
.feedback-ok{background:rgba(39,174,96,.15);border:3px solid var(--green);padding:.9rem;margin-top:.8rem}
.feedback-ko{background:rgba(192,57,43,.15);border:3px solid var(--red);padding:.9rem;margin-top:.8rem}
.fb-icon{font-size:1.2rem;margin-bottom:.4rem}
.fb-msg{font-size:.55rem;margin-bottom:.5rem}
.fb-expl{font-size:.45rem;color:var(--text-dim);line-height:2}
.fb-corr{font-size:.5rem;color:var(--gold);margin-top:.5rem}

/* SCORE SCREEN */
.score-screen{text-align:center;padding:1.5rem}
.score-stars{font-size:2.5rem;margin:1rem 0}
.score-big{font-size:1.8rem;color:var(--gold);text-shadow:3px 3px 0 #7A6000;margin:.5rem 0}
.score-label{font-size:.45rem;color:var(--text-dim);margin-bottom:1.5rem}
.score-msg{font-size:.55rem;color:var(--diamond);margin:1rem 0;line-height:2}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:1rem 0;text-align:center}
.score-stat{background:var(--bg2);border:3px solid var(--stone-dk);padding:.8rem}
.score-stat .sv{font-size:1rem;color:var(--gold);display:block;margin-bottom:.3rem}
.score-stat .sl{font-size:.38rem;color:var(--text-dim)}

/* BILAN */
.bilan-section{background:var(--bg2);border:4px solid;border-color:var(--stone-lt) var(--stone-dk) var(--stone-dk) var(--stone-lt);padding:1.2rem;margin-bottom:1rem}
.bilan-section h3{font-size:.5rem;color:var(--gold);margin-bottom:.6rem;border-bottom:2px solid var(--stone-dk);padding-bottom:.4rem}
.bilan-score-line{font-size:.45rem;color:var(--green);margin-bottom:.5rem}
.bilan-q{font-size:.4rem;color:var(--text-dim);line-height:2;margin-bottom:.4rem;border-bottom:1px solid #1A1A1A;padding-bottom:.4rem}
.bilan-q .bq-q{color:var(--text-dim)}
.bilan-q .bq-user-ok{color:var(--green)}
.bilan-q .bq-user-ko{color:var(--red)}
.bilan-q .bq-corr{color:var(--gold)}
.bilan-q .bq-expl{color:#666;font-size:.37rem}

/* TEACHER */
.teacher-section{background:var(--bg2);border:4px solid;border-color:var(--stone-lt) var(--stone-dk) var(--stone-dk) var(--stone-lt);padding:1.3rem;margin-bottom:1.2rem}
.teacher-section h2{font-size:.6rem;color:var(--gold);margin-bottom:1rem;padding-bottom:.5rem;border-bottom:2px solid var(--stone-dk)}
.stu-table{width:100%;border-collapse:collapse;font-size:.38rem}
.stu-table th{background:var(--stone-dk);color:var(--gold);padding:.5rem;text-align:left}
.stu-table td{padding:.5rem;border-bottom:1px solid var(--stone-dk);vertical-align:top;line-height:2}
.stu-table tr:hover td{background:#0A0A18}
.theme-tag{display:inline-block;background:var(--grass-dk);padding:.2rem .4rem;margin:.1rem;font-size:.3rem}

/* TOAST */
.toast{position:fixed;top:1rem;right:1rem;background:var(--bg2);border:4px solid var(--gold);padding:1rem 1.3rem;font-size:.5rem;color:var(--gold);z-index:9999;animation:tIn .3s ease;max-width:280px;pointer-events:none}
@keyframes tIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
.burst{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:5rem;z-index:9998;pointer-events:none;animation:bst .7s ease forwards}
@keyframes bst{0%{transform:translate(-50%,-50%) scale(0);opacity:1}60%{transform:translate(-50%,-50%) scale(1.5);opacity:1}100%{transform:translate(-50%,-50%) scale(2.5);opacity:0}}

/* RGPD */
.rgpd-content{background:var(--bg2);border:4px solid;border-color:var(--stone-lt) var(--stone-dk) var(--stone-dk) var(--stone-lt);padding:1.5rem;font-size:.42rem;line-height:2.2;color:var(--text-dim)}
.rgpd-content h2{font-size:.6rem;color:var(--gold);margin:1rem 0 .5rem}
.rgpd-content p{margin-bottom:.7rem}

/* FOOTER */
footer{background:#070C12;border-top:3px solid var(--stone-dk);padding:.7rem 1rem;display:flex;align-items:center;justify-content:space-between;font-size:.38rem;color:var(--text-dim);position:relative;z-index:1;flex-wrap:wrap;gap:.5rem}

/* CORRECTIONS PAGE */
.corr-list{display:flex;flex-direction:column;gap:.7rem;margin:1rem 0}
.corr-item{background:var(--bg2);border:3px solid;padding:.8rem;font-size:.42rem;line-height:2}
.corr-item.ci-ok{border-color:var(--green)}
.corr-item.ci-ko{border-color:var(--red)}
.ci-q{color:var(--text-dim);margin-bottom:.3rem}
.ci-your{margin-bottom:.2rem}
.ci-your.ok{color:var(--green)}
.ci-your.ko{color:var(--red)}
.ci-ans{color:var(--gold);margin-bottom:.2rem}
.ci-expl{color:#666;font-size:.38rem}

/* ENCOURAGEMENT */
.enc{font-size:.5rem;color:var(--gold);text-align:center;padding:.5rem;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* RESPONSIVE */
@media(max-width:600px){
  .home-title{font-size:1rem}
  .qcm-opts{grid-template-columns:1fr}
  .home-cards{flex-direction:column;align-items:center}
  .themes-grid{grid-template-columns:1fr}
  .score-grid{grid-template-columns:1fr}
  .form-row{flex-direction:column}
  .err-btns{flex-direction:column}
  #app{padding:.7rem}
}
.sep{height:1rem}
</style>
</head>
<body>
<div id="app"></div>
<footer>
  <span>⚔️ Créé par C. Iemfre</span>
  <button class="mc-btn" onclick="navigate('rgpd')" style="font-size:.37rem;padding:.35rem .7rem">📜 RGPD</button>
</footer>

function saveProgress(){try{localStorage.setItem('gramy_progress',JSON.stringify(S.progress));}catch(e){}}
function loadProgress(){try{const d=localStorage.getItem('gramy_progress');if(d)S.progress=JSON.parse(d);}catch(e){}}
function getStudentCode(){return localStorage.getItem('gramy_student_code')||'1234';}
function setStudentCode(c){localStorage.setItem('gramy_student_code',c);}
function getStudents(){try{return JSON.parse(localStorage.getItem('gramy_students')||'{}');}catch(e){return {};}}
function saveStudents(obj){localStorage.setItem('gramy_students',JSON.stringify(obj));}

// progress for a student: progress[studentId][themeId][levelN][exId] = {score,total,answers}
function getExProgress(sid,tid,ln,eid){
  if(!S.progress[sid])return null;
  if(!S.progress[sid][tid])return null;
  if(!S.progress[sid][tid][ln])return null;
  return S.progress[sid][tid][ln][eid]||null;
}
function setExProgress(sid,tid,ln,eid,data){
  if(!S.progress[sid])S.progress[sid]={};
  if(!S.progress[sid][tid])S.progress[sid][tid]={};
  if(!S.progress[sid][tid][ln])S.progress[sid][tid][ln]={};
  S.progress[sid][tid][ln][eid]=data;
  saveProgress();
}
function isLevelDone(sid,theme,ln){
  const lvl=theme.levels.find(l=>l.n===ln);
  if(!lvl)return false;
  return lvl.exs.every(ex=>!!getExProgress(sid,theme.id,ln,ex.id));
}
function isLevelUnlocked(sid,theme,ln){
  if(ln===1)return true;
  return isLevelDone(sid,theme,ln-1);
}
function themeProgress(sid,theme){
  let done=0;
  for(let l of theme.levels){if(isLevelDone(sid,theme,l.n))done++;}
  return done/theme.levels.length;
}

// ─── Toast / Burst ─────────────────────────────────────────────
function toast(msg,dur=2500){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),dur);
}
function burst(emoji){
  const b=document.createElement('div');b.className='burst';b.textContent=emoji;
  document.body.appendChild(b);setTimeout(()=>b.remove(),700);
}

// ─── Scramble words ────────────────────────────────────────────
function scramble(sentence,seed){
  const w=sentence.replace(/[?!.]/g,'').split(' ');
  const a=[...w];
  let s=seed+42;
  for(let i=a.length-1;i>0;i--){
    s=(s*1664525+1013904223)&0x7fffffff;
    const j=s%(i+1);
    [a[i],a[j]]=[a[j],a[i]];
  }
  // ensure at least one position differs
  if(a.join(' ')===w.join(' ')&&a.length>1){[a[0],a[1]]=[a[1],a[0]];}
  return a;
}

// ─── CORRECTIONS ──────────────────────────────────────────────
corrections:()=>{
  const ex=S.exercise;const lvl=S.level;
  const score=S.answers.filter(a=>a.ok).length;
  let items=S.answers.map((a,i)=>{
    const q=ex.qs[i];
    let qText='',userText='',corrText='',expl='';
    if(lvl.type==='qcm'){
      qText=q.q;userText='Réponse : '+q.opts[a.user];corrText='Bonne réponse : '+q.opts[q.c];expl=q.e;
    }else if(lvl.type==='blank'){
      qText=(q.b?q.b+' ':'')+' ('+q.h+') _____ '+q.a;
      userText='Réponse : '+a.user;corrText='Bonne réponse : '+q.ans;expl=q.e;
    }else if(lvl.type==='order'){
      qText='Remettre en ordre…';userText='Réponse : '+a.user;corrText='Bonne réponse : '+q.s;expl=q.e;
    }else if(lvl.type==='error'){
      qText=q.s;userText='Réponse : '+(a.user?'CORRECT':'INCORRECT');
      corrText=q.ok?'→ Cette phrase est CORRECTE':'→ INCORRECTE. Correction : '+q.c;expl=q.e;
    }
    return`<div class="corr-item ${a.ok?'ci-ok':'ci-ko'}">
      <div class="ci-q">❓ ${qText}</div>
      <div class="ci-your ${a.ok?'ok':'ko'}">${a.ok?'✅':'❌'} ${userText}</div>
      ${!a.ok?`<div class="ci-ans">💡 ${corrText}</div>`:''}
      <div class="ci-expl">📖 ${expl}</div>
    </div>`;
  }).join('');
  return`
<div class="nav-back" onclick="navigate('score_screen')">← Score</div>
<div class="page-header"><h1>📋 Correction complète</h1><p>${ex.title} · ${score}/${ex.qs.length} points</p></div>
<div class="corr-list">${items}</div>
<div style="display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1rem">
  <button class="mc-btn green" onclick="navigate('themes')">🗺️ Choisir un thème</button>
  <button class="mc-btn diamond" onclick="navigate('bilan')">📊 Mon bilan</button>
</div>`;
},

// ─── BILAN ────────────────────────────────────────────────────
bilan:()=>{
  const sid=S.student.id;
  let totalScore=0,totalPossible=0,exDone=0;
  THEMES.forEach(t=>{
    if(S.progress[sid]&&S.progress[sid][t.id]){
      Object.values(S.progress[sid][t.id]).forEach(lvData=>{
        Object.values(lvData).forEach(d=>{totalScore+=d.score;totalPossible+=d.total;exDone++;});
      });
    }
  });
  let sections=THEMES.map(t=>{
    const thProg=S.progress[sid]&&S.progress[sid][t.id];
    if(!thProg)return`<div class="bilan-section"><h3>${t.icon} ${t.name} – ${t.sub}</h3><div style="font-size:.4rem;color:var(--text-dim)">Aucun exercice fait pour ce thème.</div></div>`;
    let content='';
    t.levels.forEach(l=>{
      const lvData=thProg[l.n];
      if(!lvData)return;
      Object.entries(lvData).forEach(([eid,d])=>{
        content+=`<div class="bilan-score-line">✅ Niveau ${l.n} – ${l.label} : <strong>${d.score}/${d.total} pts</strong></div>`;
        d.answers.forEach((a,i)=>{
          const q=l.exs.find(ex=>ex.id===eid)?.qs[i];
          if(!q)return;
          let qT='',uT='',cT='';
          if(l.type==='qcm'){qT=q.q;uT=q.opts[a.user]||a.user;cT=q.opts[q.c];}
          else if(l.type==='blank'){qT=(q.b||'')+' ('+q.h+') ___ '+q.a;uT=a.user;cT=q.ans;}
          else if(l.type==='order'){qT='Remettre en ordre';uT=a.user;cT=q.s;}
          else if(l.type==='error'){qT=q.s;uT=a.user?'CORRECT':'INCORRECT';cT=q.ok?'CORRECT':(q.c||'INCORRECT');}
          content+=`<div class="bilan-q">
            <div class="bq-q">❓ ${qT}</div>
            <div class="${a.ok?'bq-user-ok':'bq-user-ko'}">${a.ok?'✅':'❌'} ${uT}</div>
            ${!a.ok?`<div class="bq-corr">💡 Correction : ${cT}</div>`:''}
            <div class="bq-expl">📖 ${q.e||''}</div>
          </div>`;
        });
      });
    });
    if(!content)content='<div style="font-size:.4rem;color:var(--text-dim)">Aucun exercice terminé.</div>';
    return`<div class="bilan-section"><h3>${t.icon} ${t.name} – ${t.sub}</h3>${content}</div>`;
  }).join('');
  return`
<div class="nav-back" onclick="navigate('themes')">← Thèmes</div>
<div class="student-bar"><span>👤 <span class="sname">${S.student.fn}${S.student.ln}</span></span><span class="sclass">🏫 ${S.student.cls}</span></div>
<div class="page-header"><h1>📊 Mon Bilan</h1><p>Récapitulatif complet de ta progression</p></div>
<div class="mc-box" style="padding:1.2rem;margin-bottom:1.2rem;display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;text-align:center">
  <div><div style="font-size:1.2rem;color:var(--gold)">${totalScore}</div><div style="font-size:.38rem;color:var(--text-dim)">Points totaux</div></div>
  <div><div style="font-size:1.2rem;color:var(--diamond)">${exDone}</div><div style="font-size:.38rem;color:var(--text-dim)">Exercices faits</div></div>
  <div><div style="font-size:1.2rem;color:var(--green)">${totalPossible>0?Math.round(totalScore/totalPossible*100):0}%</div><div style="font-size:.38rem;color:var(--text-dim)">Réussite globale</div></div>
</div>
${sections}
<div style="display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1rem">
  <button class="mc-btn diamond" onclick="generatePDF()">📄 Télécharger le bilan PDF</button>
  <button class="mc-btn green" onclick="navigate('themes')">🗺️ Retour aux thèmes</button>
</div>`;
},

// ─── Parse & validate exercise JSON ───────────────────────────
function parseExJSON(){
  const json=document.getElementById('exjson').value.trim();
  if(!json)throw new Error('Le champ JSON est vide.');
  const ex=JSON.parse(json);
  if(!ex.id||!ex.title||!Array.isArray(ex.qs)||ex.qs.length===0)
    throw new Error('Format invalide : id, title et qs (tableau non vide) sont requis.');
  return ex;
}

// ─── Add exercise and export full new index.html ───────────────
function addAndExport(){
  const msg=document.getElementById('ex-msg');
  try{
    const ex=parseExJSON();
    const ti=parseInt(document.getElementById('ex-theme').value);
    const li=parseInt(document.getElementById('ex-level').value)-1;

    // Check for duplicate id
    const existing=THEMES[ti].levels[li].exs.find(e=>e.id===ex.id);
    if(existing)throw new Error('Un exercice avec l\'id "'+ex.id+'" existe déjà dans ce niveau. Choisissez un id unique.');

    // Add to runtime THEMES (so serialization includes it)
    THEMES[ti].levels[li].exs.push(ex);

    // Serialize updated THEMES to JSON
    const themesJSON=JSON.stringify(THEMES,null,0);

    // Grab the full current page source
    const fullHTML=document.documentElement.outerHTML;

    // Replace the THEMES= definition in the source
    // We find the marker comment and replace until the closing ];
    const marker='const THEMES=';
    const startIdx=fullHTML.indexOf(marker);
    if(startIdx===-1)throw new Error('Marqueur THEMES introuvable dans le source.');

    // Find the matching ]; that closes THEMES — walk bracket depth
    let depth=0,i=startIdx+marker.length,found=-1;
    while(i<fullHTML.length){
      if(fullHTML[i]==='[')depth++;
      else if(fullHTML[i]===']'){depth--;if(depth===0){found=i;break;}}
      i++;
    }
    if(found===-1)throw new Error('Structure THEMES non trouvée.');

    const newHTML=fullHTML.slice(0,startIdx)+marker+themesJSON+fullHTML.slice(found+1);

    // Download as index.html
    const blob=new Blob([newHTML],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='index.html';
    document.body.appendChild(a);a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    msg.innerHTML=`<div class="msg-ok" style="line-height:2.2">
      ✅ <strong>${ex.title}</strong> intégré avec succès !<br>
      📥 Le nouveau <strong>index.html</strong> a été téléchargé.<br>
      🚀 Déposez-le sur GitHub → Vercel le redéploie → les élèves voient les nouveaux exercices !
    </div>`;
    document.getElementById('ex-preview').innerHTML='';
    document.getElementById('exjson').value='';

  }catch(e){
    // If we added the exercise before the error, remove it
    msg.innerHTML='<div class="msg-err">❌ Erreur : '+e.message+'</div>';
  }
}

// ─── QCM answer ────────────────────────────────────────────────
function answerQCM(idx){
  if(S.locked)return;S.locked=true;
  const q=S.exercise.qs[S.qIdx];
  const ok=(idx===q.c);
  S.answers.push({q:S.qIdx,user:idx,ok});
  // Visual feedback
  document.querySelectorAll('.qcm-opt').forEach(el=>el.classList.add('locked'));
  document.getElementById('opt'+idx).classList.add(ok?'ok':'ko');
  if(!ok)document.getElementById('opt'+q.c).classList.add('ok');
  document.getElementById('fb').innerHTML=ok?
    `<div class="feedback-ok"><div class="fb-icon">✅</div><div class="fb-msg">${randomEnc()}</div><div class="fb-expl">${q.e}</div></div>`:
    `<div class="feedback-ko"><div class="fb-icon">❌</div><div class="fb-msg">Pas tout à fait…</div><div class="fb-corr">💡 Bonne réponse : ${q.opts[q.c]}</div><div class="fb-expl">${q.e}</div></div>`;
  if(ok)burst('✅');
  showNextBtn();
}

// ─── BLANK answer ──────────────────────────────────────────────
function answerBlank(){
  if(S.locked)return;S.locked=true;
  const q=S.exercise.qs[S.qIdx];
  const inp=document.getElementById('blankinput');
  const val=inp.value.trim().toLowerCase();
  const ok=val===q.ans.toLowerCase();
  S.answers.push({q:S.qIdx,user:inp.value.trim(),ok});
  inp.classList.add(ok?'ok':'ko');inp.disabled=true;
  document.getElementById('blank-btn').innerHTML='';
  document.getElementById('fb').innerHTML=ok?
    `<div class="feedback-ok"><div class="fb-icon">✅</div><div class="fb-msg">${randomEnc()}</div><div class="fb-expl">${q.e}</div></div>`:
    `<div class="feedback-ko"><div class="fb-icon">❌</div><div class="fb-msg">Pas tout à fait…</div><div class="fb-corr">💡 Bonne réponse : <strong>${q.ans}</strong></div><div class="fb-expl">${q.e}</div></div>`;
  if(ok)burst('✅');
  showNextBtn();
}

// ─── ORDER chip actions ─────────────────────────────────────────
function orderPickBank(i){
  S.wordOrder.push(S.wordBank[i]);S.wordBank.splice(i,1);
  rerenderOrder();
}
function orderPickAns(i){
  S.wordBank.push(S.wordOrder[i]);S.wordOrder.splice(i,1);
  rerenderOrder();
}
function rerenderOrder(){
  document.getElementById('wbank').innerHTML=S.wordBank.map((w,i)=>`<div class="wchip" onclick="orderPickBank(${i})">${w}</div>`).join('');
  document.getElementById('wans').innerHTML=S.wordOrder.map((w,i)=>`<div class="wchip in-ans" onclick="orderPickAns(${i})">${w}</div>`).join('');
}
function resetOrder(){
  const q=S.exercise.qs[S.qIdx];
  S.wordBank=scramble(q.s,S.qIdx*7+3);S.wordOrder=[];rerenderOrder();
}
function answerOrder(){
  if(S.locked)return;
  const q=S.exercise.qs[S.qIdx];
  if(S.wordOrder.length===0){toast('❗ Place des mots dans ta phrase !');return;}
  S.locked=true;
  const userSentence=S.wordOrder.join(' ');
  // normalize for comparison (strip punctuation, lowercase)
  const norm=s=>s.replace(/[?.!]/g,'').toLowerCase().trim();
  const ok=norm(userSentence)===norm(q.s);
  S.answers.push({q:S.qIdx,user:userSentence,ok});
  document.getElementById('order-btn').innerHTML='';
  document.getElementById('fb').innerHTML=ok?
    `<div class="feedback-ok"><div class="fb-icon">✅</div><div class="fb-msg">${randomEnc()}</div><div class="fb-expl">${q.e}</div></div>`:
    `<div class="feedback-ko"><div class="fb-icon">❌</div><div class="fb-msg">Pas tout à fait…</div><div class="fb-corr">💡 Bonne réponse : <strong>${q.s}</strong></div><div class="fb-expl">${q.e}</div></div>`;
  if(ok)burst('✅');
  showNextBtn();
}

// ─── ERROR answer ──────────────────────────────────────────────
function answerError(userSaysCorrect){
  if(S.locked)return;S.locked=true;
  const q=S.exercise.qs[S.qIdx];
  const ok=(userSaysCorrect===q.ok);
  S.answers.push({q:S.qIdx,user:userSaysCorrect,ok});
  document.getElementById('errbtn').innerHTML='';
  const fb=document.getElementById('fb');
  if(ok){
    fb.innerHTML=`<div class="feedback-ok"><div class="fb-icon">✅</div><div class="fb-msg">${randomEnc()}</div><div class="fb-expl">${q.e}</div></div>`;
    burst('✅');
  }else{
    fb.innerHTML=`<div class="feedback-ko"><div class="fb-icon">❌</div><div class="fb-msg">Pas tout à fait…</div>
    <div class="fb-corr">💡 Cette phrase est <strong>${q.ok?'CORRECTE':'INCORRECTE'}</strong>${!q.ok&&q.c?'<br>Correction : '+q.c:''}</div>
    <div class="fb-expl">${q.e}</div></div>`;
  }
  showNextBtn();
}

function showNextBtn(){
  const total=S.exercise.qs.length;
  const isLast=(S.qIdx===total-1);
  const nb=document.getElementById('next-btn');
  if(nb)nb.innerHTML=isLast?
    `<button class="mc-btn gold" onclick="finishExercise()" style="width:100%;margin-top:.5rem">🏆 Voir mon score !</button>`:
    `<button class="mc-btn diamond" onclick="nextQuestion()" style="width:100%;margin-top:.5rem">➡️ Question suivante</button>`;
}

function nextQuestion(){
  S.qIdx++;S.locked=false;
  if(S.level.type==='order'){
    const q=S.exercise.qs[S.qIdx];
    S.wordBank=scramble(q.s,S.qIdx*7+3);S.wordOrder=[];
  }
  navigate('exercise');
}

function finishExercise(){
  const score=S.answers.filter(a=>a.ok).length;
  const total=S.answers.length;
  const sid=S.student.id;const tid=S.theme.id;const ln=S.level.n;const eid=S.exercise.id;
  setExProgress(sid,tid,ln,eid,{score,total,answers:S.answers.map(a=>({user:a.user,ok:a.ok}))});
  // Check if next level unlocks
  if(isLevelDone(sid,S.theme,ln)&&ln<4&&isLevelUnlocked(sid,S.theme,ln+1)){
    toast('🎉 Niveau '+(ln+1)+' débloqué !',3000);
  }
  navigate('score_screen');
}

// ─── PDF Generation ────────────────────────────────────────────
function generatePDF(){
  try{
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
    const sid=S.student.id;
    doc.setFont('helvetica','bold');
    doc.setFontSize(18);doc.text('GRAMY - Bilan de progression',105,20,{align:'center'});
    doc.setFontSize(11);doc.setFont('helvetica','normal');
    doc.text(`Eleve : ${S.student.fn} ${S.student.ln} | Classe : ${S.student.cls}`,105,30,{align:'center'});
    doc.text(`Date : ${new Date().toLocaleDateString('fr-FR')}`,105,36,{align:'center'});
    doc.line(15,40,195,40);
    let y=48;
    const addLine=(txt,bold=false,size=10,color=[0,0,0])=>{
      if(y>270){doc.addPage();y=20;}
      doc.setFont('helvetica',bold?'bold':'normal');
      doc.setFontSize(size);doc.setTextColor(...color);
      const lines=doc.splitTextToSize(txt,175);
      lines.forEach(l=>{
        if(y>270){doc.addPage();y=20;}
        doc.text(l,15,y);y+=5;
      });
      doc.setTextColor(0,0,0);
    };
    let totScore=0,totPossible=0;
    THEMES.forEach(t=>{
      const thProg=S.progress[sid]&&S.progress[sid][t.id];
      if(!thProg)return;
      let themeHasData=false;
      t.levels.forEach(l=>{
        const lvData=thProg[l.n];
        if(!lvData)return;
        Object.entries(lvData).forEach(([eid,d])=>{
          if(!themeHasData){addLine(t.name+' - '+t.sub,true,12,[40,80,40]);themeHasData=true;y+=2;}
          totScore+=d.score;totPossible+=d.total;
          addLine(`Niveau ${l.n} - ${l.label} : ${d.score}/${d.total} points (${Math.round(d.score/d.total*100)}%)`,true,10,[0,80,160]);
          const ex=l.exs.find(e=>e.id===eid);
          if(ex&&d.answers){
            d.answers.forEach((a,i)=>{
              const q=ex.qs[i];if(!q)return;
              let qT='',uT='',cT='';
              if(l.type==='qcm'){qT=q.q;uT=q.opts[a.user]||'—';cT=q.opts[q.c];}
              else if(l.type==='blank'){qT=(q.b||'')+' ('+q.h+') _____ '+q.a;uT=a.user||'—';cT=q.ans;}
              else if(l.type==='order'){qT='Remettre en ordre';uT=a.user||'—';cT=q.s;}
              else if(l.type==='error'){qT=q.s;uT=a.user===true?'CORRECT':'INCORRECT';cT=q.ok?'CORRECT':(q.c?'INCORRECT -> '+q.c:'INCORRECT');}
              addLine((a.ok?'[OK] ':'[ERR]')+' Q: '+qT,false,9,a.ok?[0,120,0]:[180,0,0]);
              addLine('     Reponse : '+uT,false,9);
              if(!a.ok)addLine('     Correction : '+cT,false,9,[0,80,160]);
              addLine('     Explication : '+(q.e||''),false,8,[100,100,100]);
              y+=1;
            });
          }
          y+=3;
        });
      });
    });
    if(totPossible>0){
      doc.line(15,y,195,y);y+=6;
      addLine(`Score global : ${totScore} / ${totPossible} points (${Math.round(totScore/totPossible*100)}%)`,true,12,[40,40,150]);
    }
    doc.save(`GRAMY_${S.student.fn}${S.student.ln}_${S.student.cls}_${new Date().toLocaleDateString('fr-FR').replace(/\//g,'-')}.pdf`);
    toast('📄 Bilan PDF téléchargé !');
  }catch(e){toast('❌ Erreur PDF : '+e.message);}
}
